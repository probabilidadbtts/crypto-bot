name: Deploy to Sepolia

on:
  push:
    branches: [main]
  workflow_dispatch:  # Permite ejecutar manualmente desde la pestaña Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Desplegar a Sepolia
        run: npx hardhat run scripts/deploy.js --network sepolia
        env:
          ALCHEMY_API_URL_SEPOLIA: ${{ secrets.ALCHEMY_API_URL_SEPOLIA }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

      - name: Verificar en Etherscan
        if: secrets.ETHERSCAN_API_KEY != ''
        run: |
          npx hardhat verify --network sepolia $(node -e "console.log(require('./deployment.json').address)") "MiToken" "MTK" "1000000000000000000000000"
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
